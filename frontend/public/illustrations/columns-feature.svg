<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="col-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="col-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="300" rx="24" fill="url(#col-bg)" />

  <!-- Column 1 -->
  <rect x="35" y="45" width="90" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="47" y="60" width="45" height="8" rx="4" fill="#6366f1" />
  <rect x="47" y="80" width="66" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <rect x="47" y="130" width="66" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

  <!-- Column 2 (Active/Custom) -->
  <rect x="145" y="45" width="105" height="210" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#col-shadow)" />
  <rect x="157" y="58" width="55" height="9" rx="4.5" fill="#8b5cf6" />
  <rect x="157" y="78" width="81" height="45" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
  <rect x="157" y="133" width="81" height="45" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
  <circle cx="230" cy="62" r="8" fill="#8b5cf6" fill-opacity="0.15" />
  <text x="227" y="66" fill="#7c3aed" font-size="10" font-family="system-ui, sans-serif" font-weight="bold">3</text>

  <!-- Add column dashed placeholder -->
  <rect x="270" y="45" width="95" height="210" rx="12" fill="#ffffff" fill-opacity="0.6" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="317" cy="130" r="18" fill="#4f46e5" />
  <path d="M 317 122 L 317 138 M 309 130 L 325 130" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <text x="282" y="168" fill="#4f46e5" font-size="11" font-family="system-ui, sans-serif" font-weight="700">Nouvelle colonne</text>
</svg>
