<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="collab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="live-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="300" rx="24" fill="url(#collab-bg)" />

  <rect x="45" y="40" width="310" height="220" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#live-shadow)" />

  <!-- Terminal header -->
  <circle cx="68" cy="62" r="5" fill="#ef4444" />
  <circle cx="84" cy="62" r="5" fill="#f59e0b" />
  <circle cx="100" cy="62" r="5" fill="#10b981" />
  <text x="120" y="66" fill="#94a3b8" font-size="11" font-family="monospace">Flux d'Activité en Direct</text>
  <rect x="270" y="52" width="70" height="20" rx="10" fill="#10b981" fill-opacity="0.2" />
  <circle cx="282" cy="62" r="3" fill="#34d399" />
  <text x="292" y="66" fill="#34d399" font-size="9" font-family="system-ui, sans-serif" font-weight="bold">LIVE</text>

  <!-- Log line 1 -->
  <rect x="65" y="90" width="48" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="73" y="103" fill="#34d399" font-size="9" font-family="monospace" font-weight="bold">CREATE</text>
  <text x="122" y="103" fill="#f1f5f9" font-size="10" font-family="monospace">Nouvelle tâche ajoutée</text>

  <!-- Log line 2 -->
  <rect x="65" y="122" width="48" height="18" rx="4" fill="#6366f1" fill-opacity="0.25" />
  <text x="73" y="135" fill="#818cf8" font-size="9" font-family="monospace" font-weight="bold">UPLOAD</text>
  <text x="122" y="135" fill="#f1f5f9" font-size="10" font-family="monospace">Rapport-Trimestre.pdf lié</text>

  <!-- Log line 3 -->
  <rect x="65" y="154" width="48" height="18" rx="4" fill="#f59e0b" fill-opacity="0.2" />
  <text x="73" y="167" fill="#fbbf24" font-size="9" font-family="monospace" font-weight="bold">UPDATE</text>
  <text x="122" y="167" fill="#f1f5f9" font-size="10" font-family="monospace">Statut -> [En cours]</text>

  <!-- Progress bar -->
  <rect x="65" y="200" width="270" height="6" rx="3" fill="#334155" />
  <rect x="65" y="200" width="190" height="6" rx="3" fill="#10b981" />
  <text x="65" y="226" fill="#64748b" font-size="10" font-family="monospace">12 événements synchronisés</text>
</svg>
